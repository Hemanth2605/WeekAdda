<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>WeekAdda — OTT Releases This Week India, New Movies & Cricket</title>
    <meta
      name="description"
      content="OTT releases this week in India — daily-updated movies & web series on Netflix, Prime Video, JioHotstar, ZEE5, Sun NXT & more, plus theatre and cricket."
    />
    <meta
      name="keywords"
      content="new movie releases this week, OTT releases this week India, new movies on Netflix India, JioHotstar new releases, Amazon Prime new movies, Telugu movies this week, Tamil new releases, Hindi movies 2026, Malayalam OTT releases, upcoming movies India, web series releases, cricket results, cricket fixtures"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://weekadda.com/" />
    <meta name="theme-color" content="#0a0a0e" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeekAdda" />
    <meta property="og:title" content="WeekAdda — OTT Releases This Week India, New Movies & Cricket" />
    <meta
      property="og:description"
      content="This week's OTT releases on Netflix, Prime Video, JioHotstar & more, movie releases in every Indian language, plus cricket fixtures and results."
    />
    <meta property="og:url" content="https://weekadda.com/" />
    <meta property="og:locale" content="en_IN" />
    <!-- Default share card. Movie pages swap this for the poster in worker.ts;
         it must stay a single tag, since a crawler takes the first one it finds. -->
    <meta property="og:image" content="https://weekadda.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WeekAdda — OTT releases, new movies and cricket, this week in India" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://weekadda.com/og-cover.png" />
    <meta name="twitter:title" content="WeekAdda — OTT Releases This Week India & New Movies" />
    <meta
      name="twitter:description"
      content="Daily OTT releases on Netflix, Prime Video, JioHotstar, Sony LIV, ZEE5 & Aha + weekly movie releases by language and cricket updates."
    />

    <!-- Structured data: site + search action -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "WeekAdda",
        "alternateName": "WeekAdda Entertainment",
        "url": "https://weekadda.com/",
        "description": "OTT releases this week in India, new movie releases by language, and cricket fixtures & results.",
        "author": { "@id": "https://weekadda.com/about#hemanth-mareedu" },
        "publisher": { "@id": "https://weekadda.com/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://weekadda.com/movies?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!--
      The entity behind the site. Indexing is not recognition: Google can serve
      our pages and still have no idea what "WeekAdda" is, which is why a bare
      domain search returns nothing about us. This is the machine-readable
      claim that the brand exists, and sameAs is the part that carries weight —
      it only does real work once there are official profiles to point at.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://weekadda.com/#organization",
        "name": "WeekAdda",
        "alternateName": "WeekAdda Entertainment",
        "url": "https://weekadda.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://weekadda.com/favicon-512.png",
          "width": 512,
          "height": 512
        },
        "image": "https://weekadda.com/og-cover.png",
        "description": "Weekly entertainment portal for India: OTT arrivals on Netflix, Prime Video, JioHotstar, ZEE5, Sony LIV and Aha, new movie releases by language, and cricket fixtures and results.",
        "foundingDate": "2026-07",
        "founder": { "@id": "https://weekadda.com/about#hemanth-mareedu" },
        "areaServed": { "@type": "Country", "name": "India" },
        "sameAs": ["https://www.youtube.com/channel/UCfBLAj6HDdkOKHlOJZ6wUig"]
      }
    </script>

    <!--
      The person behind the site, defined once and referenced by @id from both
      the WebSite's author and the Organization's founder above. Previously
      those were two separate inline Person objects and only one of them
      carried sameAs, so there was nothing telling Google they were the same
      human — which is the whole job of an entity: one node, one identity, one
      set of profiles to corroborate it. /about adds the photo and detail
      against this same @id, so the two merge rather than compete.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://weekadda.com/about#hemanth-mareedu",
        "name": "Hemanth Mareedu",
        "url": "https://weekadda.com/about",
        "jobTitle": "Software Engineer",
        "description": "Founder of WeekAdda, and a software engineer with 10+ years of experience.",
        "sameAs": ["https://www.linkedin.com/in/hemanth-mareedu-a69271116/"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Installed to a Home Screen this has to stop looking like a bookmark.
      The manifest is what Android reads: a real name under the icon, our own
      background behind the splash, and `display: standalone` so it opens
      without a URL bar.

      Named .json rather than .webmanifest on purpose — every static host serves
      .json as application/json, which browsers accept for a manifest, whereas
      .webmanifest depends on the host knowing that extension. Not worth a
      silently ignored manifest to win a file suffix.
    -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      Safari reads almost none of the manifest. These are what an iPhone or iPad
      actually uses: the first drops the browser chrome, and the last is the
      name under the icon — without it iOS falls back to the <title>, which is
      written for search results and far too long to sit under an app icon.
      This is also the state where Safari finally exposes PushManager, so the
      notification bell appears once the site is installed.

      The status bar is `black`, not `black-translucent`. Translucent is the
      more app-like of the two, but it lets the page run *under* the status bar,
      and nothing here pads for that — `safe-area-inset-top` appears nowhere in
      index.css, while the bottom bar uses `-bottom` six times. The navbar would
      sit behind the clock on the installed app's first screen. `black` starts
      the page below the bar and reads as one surface against our near-black
      background. Worth revisiting together with a top inset, not before.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WeekAdda" />
    <script>
      // Apply the saved theme before first paint; dark is the default
      try {
        if (localStorage.getItem('weekadda-theme') === 'light')
          document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
